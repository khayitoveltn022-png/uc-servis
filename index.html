<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UC SERVIS</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    background:#080b10;
    color:#fff;
    font-family:Arial, sans-serif;
}

body{
    min-height:100vh;
}

header{
    background:#111722;
    border-bottom:1px solid #293342;
    padding:24px 15px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:30px;
}

header p{
    margin:8px 0 0;
    color:#aeb6c3;
}

.container{
    width:100%;
    max-width:800px;
    margin:auto;
    padding:18px;
}

.nav{
    display:flex;
    gap:8px;
    margin-bottom:18px;
}

.nav button{
    flex:1;
    padding:12px 5px;
    font-size:14px;
}

button{
    border:0;
    border-radius:10px;
    padding:12px 16px;
    background:#f5b400;
    color:#111;
    font-weight:bold;
    cursor:pointer;
}

button:active{
    transform:scale(.98);
}

.form,
.card,
.history{
    background:#151b25;
    border:1px solid #293342;
    border-radius:16px;
    padding:18px;
    margin-bottom:14px;
}

h2{
    margin-top:0;
}

label{
    display:block;
    margin-top:12px;
    margin-bottom:6px;
    color:#dfe5ee;
}

input,
select,
textarea{
    width:100%;
    padding:14px;
    margin:0 0 8px;
    border-radius:10px;
    border:1px solid #303a4a;
    background:#0d1219;
    color:#fff;
    font-size:16px;
    outline:none;
}

input::placeholder,
textarea::placeholder{
    color:#7f8997;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#f5b400;
}

.total-box{
    margin:15px 0;
    padding:15px;
    background:#0d1219;
    border:1px solid #303a4a;
    border-radius:12px;
    text-align:center;
}

.total-title{
    color:#aeb6c3;
    font-size:14px;
}

#price{
    display:block;
    margin-top:5px;
    color:#fff;
    font-size:28px;
    font-weight:bold;
}

.small{
    color:#9da6b3;
    font-size:13px;
    margin-bottom:10px;
}

.ok{
    color:#65e68b;
    margin-top:12px;
}

.err{
    color:#ff7676;
    margin-top:12px;
}

.hidden{
    display:none !important;
}

.history{
    margin-top:10px;
}

.status{
    color:#ffd447;
    font-weight:bold;
}

.author{
    text-align:center;
    color:#8f9aaa;
    margin:30px 0 10px;
    font-size:13px;
}

@media(max-width:500px){

    header h1{
        font-size:25px;
    }

    .container{
        padding:12px;
    }

    .nav button{
        padding:10px 3px;
        font-size:12px;
    }

    #price{
        font-size:25px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🔥 UC SERVIS</h1>
    <p>PUBG Mobile UC xizmatlari</p>
</header>

<div class="container">

            🛒 Buyurtma
        </button>
