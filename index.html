<style>

body{

header{

button:hover{

button:disabled{

.card,

label{

input,
select,

  margin:7px 0 13px;

  background:#0d1219;
  color:white;

}

input:focus,
select:focus,

.total{

.small{

}

.ok{

}

.err{

  margin-top:12px;
  white-space:pre-line;
}

.hidden{

}

.history{
  background:#151b25;

  border-radius:14px;
  padding:14px;
  margin:10px 0;
}

.status{
  color:#ffd447;
  font-weight:bold;
}

.uc-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin:15px 0;
}

.uc-item{
  background:#0d1219;
  border:1px solid #303a4a;
  border-radius:12px;
  padding:14px;
  cursor:pointer;

}

.uc-item:hover{
  border-color:#f5b400;
}

.uc-item.active{

.uc-name{

.uc-price{

}

.loading{

}

.author{
  text-align:center;
  color:#8f9aaa;

  font-size:13px;
}

@media(max-width:500px){

  }

  .nav button{
    padding:10px 5px;

  }

  .uc-grid{
    grid-template-columns:1fr 1fr;
  }
}

/* =====================================
   API REQUEST
===================================== */

async function api(url, options = {}){

  const response = await fetch(
    API + url,
    {
      ...options,

      headers:{
        "Content-Type":"application/json",
        ...(options.headers || {})
      }
    }
  );

  const data = await response.json();

  if(!response.ok){

    throw new Error(
      data.error ||
      "Server xatosi"
    );

  }

  return data;

}
