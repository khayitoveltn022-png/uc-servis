<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>UC SERVIS</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    padding:0;
    background:#080b10;
    color:#fff;
    font-family:Arial,sans-serif;
}

body{min-height:100vh}

header{
    background:#111722;
    border-bottom:1px solid #293342;
    padding:24px 15px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:30px;
}

header p{
    margin:8px 0 0;
    color:#aeb6c3;
}

.container{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:18px;
}

.nav{
    display:flex;
    gap:8px;
    margin-bottom:18px;
}

.nav button{
    flex:1;
    padding:12px 5px;
    font-size:14px;
}

button{
    border:0;
    border-radius:10px;
    padding:12px 16px;
    background:#f5b400;
    color:#111;
    font-weight:bold;
    cursor:pointer;
}

button:active{transform:scale(.98)}

.form,.card,.history{
    background:#151b25;
    border:1px solid #293342;
    border-radius:16px;
    padding:18px;
    margin-bottom:14px;
}

h2{margin-top:0}

label{
    display:block;
    margin-top:12px;
    margin-bottom:6px;
    color:#dfe5ee;
}

input,select,textarea{
    width:100%;
    padding:14px;
    margin:0 0 8px;
    border-radius:10px;
    border:1px solid #303a4a;
    background:#0d1219;
    color:#fff;
    font-size:16px;
    outline:none;
}

input::placeholder,textarea::placeholder{
    color:#7f8997;
}

input:focus,select:focus,textarea:focus{
    border-color:#f5b400;
}

.catalog{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-top:12px;
}

.product{
    background:#0d1219;
    border:1px solid #303a4a;
    border-radius:12px;
    padding:14px;
    cursor:pointer;
    transition:.15s;
}

.product:hover{border-color:#f5b400}

.product.active{
    border-color:#f5b400;
    box-shadow:0 0 0 1px #f5b400;
}

.product-name{
    font-weight:bold;
    line-height:1.3;
}

.product-price{
    color:#f5b400;
    font-size:18px;
    font-weight:bold;
    margin-top:8px;
}

.small{
    color:#9da6b3;
    font-size:13px;
    margin-bottom:10px;
}

.total-box{
    margin:15px 0;
    padding:15px;
    background:#0d1219;
    border:1px solid #303a4a;
    border-radius:12px;
    text-align:center;
}

.total-title{
    color:#aeb6c3;
    font-size:14px;
}

#price{
    display:block;
    margin-top:5px;
    color:#fff;
    font-size:28px;
    font-weight:bold;
}

#selectedUC,#selectedG2{
    display:block;
    margin-top:5px;
    color:#f5b400;
    font-weight:bold;
}

.ok{
    color:#65e68b;
    margin-top:12px;
}

.err{
    color:#ff7676;
    margin-top:12px;
}

.hidden{
    display:none !important;
}

.history{
    margin-top:10px;
}

.status{
    color:#ffd447;
    font-weight:bold;
}

.author{
    text-align:center;
    color:#8f9aaa;
    margin:30px 0 10px;
    font-size:13px;
}

.section-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.badge{
    background:#202938;
    color:#aeb6c3;
    padding:5px 9px;
    border-radius:20px;
    font-size:12px;
}

@media(max-width:600px){

    header h1{font-size:25px}

    .container{padding:12px}

    .nav{
        display:grid;
        grid-template-columns:1fr 1fr;
    }

    .nav button:last-child{
        grid-column:1 / -1;
    }

    .catalog{
        grid-template-columns:1fr;
    }

    #price{font-size:25px}
}
</style>
</head>

<body>

<header>
    <h1>🔥 UC SERVIS</h1>
    <p>PUBG Mobile xizmatlari</p>
</header>

<div class="container">

<div class="nav">

    <button onclick="page('ucShop')">💎 UC</button>

    <button onclick="page('g2bulkShop')">🛍️ G2BULK</button>

    <button onclick="page('history')">📋 Buyurtmalar</button>

    <button onclick="page('complaint')">📝 Murojaat</button>

</div>


<!-- UC SHOP -->

<section id="ucShop">

<div class="form">

<div class="section-title">
    <h2>💎 UC buyurtma</h2>

    <span class="badge">12 ta paket</span>
</div>

<div class="small">
    UC paketini tanlang
</div>

<div id="ucCatalog" class="catalog"></div>

<div class="total-box">

    <div class="total-title">
        Tanlangan UC
    </div>

    <span id="selectedUC">
        Tanlanmagan
    </span>

    <span id="price">
        0 so‘m
    </span>

</div>

<label>🆔 PUBG ID</label>

<input
    id="ucPubg"
    type="text"
    placeholder="PUBG ID"
>

<label>📱 Telefon</label>

<input
    id="ucPhone"
    type="tel"
    placeholder="+998 XX XXX XX XX"
>

<label>💳 To‘lov</label>

<select id="ucPayment">

    <option value="Payme">Payme</option>
    <option value="Uzcard">Uzcard</option>
    <option value="Humo">Humo</option>

</select>

<button
    style="width:100%;margin-top:8px;"
    onclick="orderUC()"
>
    🛒 UC buyurtma berish
</button>

<div id="ucMsg"></div>

</div>

</section>


<!-- G2BULK SHOP -->

<section id="g2bulkShop" class="hidden">

<div class="form">

<div class="section-title">

    <h2>🛍️ G2BULK katalog</h2>

    <span class="badge">
        23 ta mahsulot
    </span>

</div>

<div class="small">
    PUBG Mobile uchun G2BULK mahsulotlari
</div>

<div id="g2bulkCatalog" class="catalog"></div>

<div class="total-box">

    <div class="total-title">
        Tanlangan mahsulot
    </div>

    <span id="selectedG2">
        Tanlanmagan
    </span>

    <span id="g2price">
        0 so‘m
    </span>

</div>

<label>🆔 PUBG ID</label>

<input
    id="g2Pubg"
    type="text"
    placeholder="PUBG ID"
>

<button
    style="width:100%;background:#3478f6;color:#fff;"
    onclick="validateG2Player()"
>
    🔍 PUBG ID tekshirish
</button>

<div id="g2Validation"></div>

<label>📱 Telefon</label>

<input
    id="g2Phone"
    type="tel"
    placeholder="+998 XX XXX XX XX"
>

<label>💳 To‘lov</label>

<select id="g2Payment">

    <option value="Payme">Payme</option>
    <option value="Uzcard">Uzcard</option>
    <option value="Humo">Humo</option>

</select>

<button
    style="width:100%;margin-top:8px;"
    onclick="orderG2Bulk()"
>
    🛒 G2BULK buyurtma berish
</button>

<div id="g2Msg"></div>

</div>

</section>


<!-- HISTORY -->

<section id="history" class="hidden">

<div class="form">

<h2>📋 Buyurtmalarim</h2>

<input
    id="hphone"
    type="tel"
    placeholder="Telefon raqamingiz"
>

<button
    style="width:100%;"
    onclick="historyLoad()"
>
    Ko‘rish
</button>

</div>

<div id="list"></div>

</section>


<!-- COMPLAINT -->

<section id="complaint" class="hidden">

<div class="form">

<h2>📝 Shikoyat / murojaat</h2>

<input
    id="cphone"
    type="tel"
    placeholder="Telefon"
>

<textarea
    id="ctext"
    rows="6"
    placeholder="Murojaatingiz..."
></textarea>

<button
    style="width:100%;"
    onclick="complaint()"
>
    Yuborish
</button>

<div id="cmsg"></div>

</div>

</section>


<div class="author">
    Muallif: khayitovEldor
</div>

</div>


<script>

/* API */

const API = "";


/* UC CATALOG */

const UC_CATALOG = [

    {amount:60,name:"60 UC",price:11500},
    {amount:325,name:"325 UC",price:63000},
    {amount:660,name:"660 UC",price:120000},
    {amount:985,name:"985 UC",price:186500},
    {amount:1320,name:"1320 UC",price:240000},
    {amount:1800,name:"1800 UC",price:295000},
    {amount:2460,name:"2460 UC",price:406000},
    {amount:3850,name:"3850 UC",price:547000},
    {amount:5650,name:"5650 UC",price:856000},
    {amount:8100,name:"8100 UC",price:1090000},
    {amount:11950,name:"11950 UC",price:1710000},
    {amount:16200,name:"16200 UC",price:2250000}

];


/* G2BULK CATALOG */

const G2BULK_CATALOG = [

    {id:"first_purchase_pack",name:"First Purchase Pack",price:12517},

    {id:"prime_1_month",name:"Prime (1 Month)",price:12517},

    {id:"weekly_deal_pack_1",name:"Weekly Deal Pack 1",price:12702},

    {id:"60_wow_coins",name:"60 WOW Coins",price:12773},

    {id:"firearm_materials",name:"Upgradable Firearm Materials Pack",price:37495},

    {id:"prime_3_months",name:"Prime (3 Months)",price:37552},

    {id:"weekly_deal_pack_2",name:"Weekly Deal Pack 2",price:37936},

    {id:"weekly_mythic_emblem",name:"Weekly Mythic Emblem Value Pack",price:37936},

    {id:"mythic_emblem_pack",name:"Mythic Emblem Pack",price:62430},

    {id:"325_wow_coins",name:"325 WOW Coins",price:65290},

    {id:"prime_6_months",name:"Prime (6 Months)",price:69471},

    {id:"elite_pass_1_50",name:"Elite Pass LV1-50",price:69735},

    {id:"prime_plus_1_month",name:"Prime Plus (1 Month)",price:115785},

    {id:"660_wow_coins",name:"660 WOW Coins",price:120786},

    {id:"prime_12_months",name:"Prime (12 Months)",price:138942},

    {id:"elite_pass_1_100",name:"Elite Pass LV1-100",price:140679},

    {id:"1800_wow_coins",name:"1800 WOW Coins",price:302095},

    {id:"elite_pass_plus",name:"Elite Pass Plus LV1-100",price:344501},

    {id:"prime_plus_3_months",name:"Prime Plus (3 Months)",price:347357},

    {id:"3850_wow_coins",name:"3850 WOW Coins",price:604334},

    {id:"prime_plus_6_months",name:"Prime Plus (6 Months)",price:684187},

    {id:"8100_wow_coins",name:"8100 WOW Coins",price:1208656},

    {id:"prime_plus_12_months",name:"Prime Plus (12 Months)",price:1493548}

];


let selectedUC = null;
let selectedG2 = null;


function money(number){

    return Number(number || 0)
        .toLocaleString("uz-UZ");

}


/* RENDER UC */

function renderUC(){

    const box =
        document.getElementById("ucCatalog");

    box.innerHTML = "";

    UC_CATALOG.forEach(product => {

        const div =
            document.createElement("div");

        div.className = "product";

        div.innerHTML = `
            <div class="product-name">
                💎 ${product.name}
            </div>

            <div class="product-price">
                ${money(product.price)} so‘m
            </div>
        `;

        div.onclick = function(){

            document
                .querySelectorAll("#ucCatalog .product")
                .forEach(x =>
                    x.classList.remove("active")
                );

            div.classList.add("active");

            selectedUC = product;

            document.getElementById("selectedUC")
                .textContent = product.name;

            document.getElementById("price")
                .textContent =
                money(product.price) + " so‘m";
        };

        box.appendChild(div);

    });

}


/* RENDER G2BULK */

function renderG2Bulk(){

    const box =
        document.getElementById("g2bulkCatalog");

    box.innerHTML = "";

    G2BULK_CATALOG.forEach(product => {

        const div =
            document.createElement("div");

        div.className = "product";

        div.innerHTML = `
            <div class="product-name">
                🛍️ ${product.name}
            </div>

            <div class="product-price">
                ${money(product.price)} so‘m
            </div>
        `;

        div.onclick = function(){

            document
                .querySelectorAll("#g2bulkCatalog .product")
                .forEach(x =>
                    x.classList.remove("active")
                );

            div.classList.add("active");

            selectedG2 = product;

            document.getElementById("selectedG2")
                .textContent = product.name;

            document.getElementById("g2price")
                .textContent =
                money(product.price) + " so‘m";
        };

        box.appendChild(div);

    });

}


/* API REQUEST */

async function api(url,options={}){

    const response =
        await fetch(
            API + url,
            {
                ...options,

                headers:{
                    "Content-Type":"application/json",
                    ...(options.headers || {})
                }
            }
        );

    const text =
        await response.text();

    let data;

    try{

        data = JSON.parse(text);

    }catch{

        throw new Error(
            "Serverdan noto‘g‘ri javob keldi."
        );

    }

    if(!response.ok){

        throw new Error(
            data.error ||
            "Xatolik yuz berdi."
        );

    }

    return data;
}


/* UC ORDER */

async function orderUC(){

    if(!selectedUC){

        show(
            "ucMsg",
            "Avval UC paketini tanlang.",
            true
        );

        return;
    }

    const pubgId =
        document.getElementById("ucPubg")
            .value.trim();

    const phone =
        document.getElementById("ucPhone")
            .value.trim();

    const payment =
        document.getElementById("ucPayment")
            .value;

    if(!pubgId){

        show(
            "ucMsg",
            "PUBG ID kiriting.",
            true
        );

        return;
    }

    if(!phone){

        show(
            "ucMsg",
            "Telefon raqam kiriting.",
            true
        );

        return;
    }

    try{

        const data =
            await api(
                "/api/order",
                {
                    method:"POST",

                    body:JSON.stringify({

                        player_id:pubgId,
                        uc:selectedUC.amount,
                        price:selectedUC.price,
                        phone:phone,
                        payment:payment

                    })
                }
            );

        show(
            "ucMsg",
            "✅ UC buyurtma qabul qilindi. № " +
            data.orderId
        );

    }catch(error){

        show(
            "ucMsg",
            error.message,
            true
        );

    }

}


/* G2 PLAYER VALIDATION */

async function validateG2Player(){

    const playerId =
        document.getElementById("g2Pubg")
            .value.trim();

    if(!playerId){

        show(
            "g2Validation",
            "PUBG ID kiriting.",
            true
        );

        return;
    }

    show(
        "g2Validation",
        "⏳ Tekshirilmoqda..."
    );

    try{

        const data =
            await api(
                "/api/pubg/validate",
                {
                    method:"POST",

                    body:JSON.stringify({
                        player_id:playerId
                    })
                }
            );

        if(data.valid === false){

            show(
                "g2Validation",
                "❌ PUBG ID tasdiqlanmadi.",
                true
            );

            return;
        }

        show(
            "g2Validation",
            "✅ PUBG ID tasdiqlandi" +
            (
                data.player_name
                ? " — " + data.player_name
                : ""
            )
        );

    }catch(error){

        show(
            "g2Validation",
            error.message,
            true
        );

    }

}
    /* =================================================
   G2BULK ORDER
================================================= */

async function orderG2Bulk(){

    if(!selectedG2){

        show(
            "g2Msg",
            "Avval G2BULK mahsulotini tanlang.",
            true
        );

        return;
    }


    const pubgId =
        document
            .getElementById("g2Pubg")
            .value
            .trim();


    const phone =
        document
            .getElementById("g2Phone")
            .value
            .trim();


    const payment =
        document
            .getElementById("g2Payment")
            .value;


    if(!pubgId){

        show(
            "g2Msg",
            "PUBG ID kiriting.",
            true
        );

        return;
    }


    if(!phone){

        show(
            "g2Msg",
            "Telefon raqam kiriting.",
            true
        );

        return;
    }


    try{

        const data =
            await api(
                "/api/g2bulk/order",
                {

                    method:"POST",

                    body:JSON.stringify({

                        player_id:pubgId,

                        product_id:
                            selectedG2.id,

                        product_name:
                            selectedG2.name,

                        price:
                            selectedG2.price,

                        phone:phone,

                        payment:payment

                    })

                }
            );


        show(
            "g2Msg",
            "✅ G2BULK buyurtma qabul qilindi. № " +
            data.orderId
        );


    }catch(error){

        show(
            "g2Msg",
            error.message,
            true
        );

    }

}


/* =================================================
   BUYURTMALAR TARIXI
================================================= */

async function historyLoad(){

    const phone =
        document
            .getElementById("hphone")
            .value
            .trim();


    if(!phone){

        document
            .getElementById("list")
            .innerHTML =
            `
            <div class="card err">
                Telefon raqamingizni kiriting.
            </div>
            `;

        return;
    }


    const list =
        document.getElementById("list");


    list.innerHTML =
        `
        <div class="card small">
            ⏳ Buyurtmalar yuklanmoqda...
        </div>
        `;


    try{

        const data =
            await api(
                "/api/orders?phone=" +
                encodeURIComponent(phone)
            );


        if(
            !data.orders ||
            data.orders.length === 0
        ){

            list.innerHTML =
                `
                <div class="card">
                    📭 Buyurtma topilmadi.
                </div>
                `;

            return;
        }


        list.innerHTML =
            data.orders
                .slice()
                .reverse()
                .map(order => {

                    const productName =
                        order.product_name ||
                        (
                            order.uc
                            ? Number(order.uc).toLocaleString("uz-UZ") +
                              " UC"
                            : "G2BULK"
                        );


                    return `

                    <div class="history">

                        <b>
                            📦 Buyurtma #${order.id}
                        </b>

                        <p>
                            🛍️ ${productName}
                        </p>

                        ${
                            order.uc
                            ?
                            `
                            <p>
                                💎
                                ${Number(order.uc).toLocaleString("uz-UZ")}
                                UC
                            </p>
                            `
                            :
                            ""
                        }

                        <p>
                            💰
                            ${money(order.price)}
                            so‘m
                        </p>

                        <p>
                            💳
                            ${order.payment || "-"}
                        </p>

                        <p class="status">
                            📌 ${order.status || "Kutilmoqda"}
                        </p>

                        <p class="small">
                            ${order.createdAt || ""}
                        </p>

                    </div>

                    `;

                })
                .join("");


    }catch(error){

        list.innerHTML =
            `
            <div class="card err">
                ${error.message}
            </div>
            `;

    }

}


/* =================================================
   MUROJAAT
================================================= */

async function complaint(){

    const phone =
        document
            .getElementById("cphone")
            .value
            .trim();


    const text =
        document
            .getElementById("ctext")
            .value
            .trim();


    if(!phone){

        show(
            "cmsg",
            "Telefon raqamingizni kiriting.",
            true
        );

        return;
    }


    if(!text){

        show(
            "cmsg",
            "Murojaatingizni yozing.",
            true
        );

        return;
    }


    try{

        await api(
            "/api/complaints",
            {

                method:"POST",

                body:JSON.stringify({

                    phone:phone,

                    text:text

                })

            }
        );


        show(
            "cmsg",
            "✅ Murojaat muvaffaqiyatli yuborildi."
        );


        document
            .getElementById("ctext")
            .value = "";


    }catch(error){

        show(
            "cmsg",
            error.message,
            true
        );

    }

}


/* =================================================
   XABAR
================================================= */

function show(
    id,
    text,
    error=false
){

    const element =
        document.getElementById(id);


    if(!element) return;


    element.className =
        error
        ? "err"
        : "ok";


    element.textContent =
        text;

}


/* =================================================
   SAHIFA ALMASHTIRISH
================================================= */

function page(id){

    const pages = [

        "ucShop",
        "g2bulkShop",
        "history",
        "complaint"

    ];


    pages.forEach(name => {

        const element =
            document.getElementById(name);


        if(element){

            element.classList.add("hidden");

        }

    });


    const selected =
        document.getElementById(id);


    if(selected){

        selected.classList.remove("hidden");

    }


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =================================================
   BOSHLANG‘ICH ISHGA TUSHIRISH
================================================= */

renderUC();

renderG2Bulk();

page("ucShop");


</script>

</body>
</html>
