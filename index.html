<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UC SERVIS</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#080b10;
  color:white;
}

header{
  padding:22px 15px;
  text-align:center;
  background:#111722;
  border-bottom:1px solid #293140;
}

header h1{
  margin:0;
  font-size:30px;
}

header p{
  color:#aeb6c3;
  margin:8px 0 0;
}

.container{
  max-width:800px;
  margin:auto;
  padding:18px;
}

.section-title{
  margin:25px 0 12px;
  font-size:22px;
}

.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.card{
  background:#151b25;
  border:1px solid #293342;
  border-radius:16px;
  padding:16px;
  text-align:center;
}

.icon{
  font-size:42px;
  margin-bottom:8px;
}

.card h3{
  margin:7px 0;
}

.price{
  color:#ffd447;
  font-weight:bold;
  margin:10px 0;
}

button{
  border:0;
  border-radius:10px;
  padding:12px 16px;
  background:#f5b400;
  color:#111;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

.form{
  background:#151b25;
  padding:18px;
  border-radius:16px;
  margin-top:15px;
}

label{
  display:block;
  margin-top:8px;
}

input,select{
  width:100%;
  padding:13px;
  margin:7px 0 13px;
  border-radius:9px;
  border:1px solid #303a4a;
  background:#0d1219;
  color:white;
}

.total{
  font-size:21px;
  margin:15px 0;
  font-weight:bold;
}

.message{
  margin-top:12px;
  color:#65e68b;
}

.order-btn{
  width:100%;
  font-size:16px;
}

.history-item{
  background:#151b25;
  border:1px solid #293342;
  border-radius:14px;
  padding:15px;
  margin:10px 0;
}

.status{
  color:#ffd447;
  font-weight:bold;
}

.nav{
  display:flex;
  gap:8px;
  margin:20px 0;
}

.nav button{
  flex:1;
}

.back{
  background:#303948;
  color:white;
}

.admin-box{
  background:#151b25;
  border-radius:16px;
  padding:18px;
  margin-top:15px;
}

.small{
  color:#9da6b3;
  font-size:14px;
}

.car-image{
  width:100%;
  height:130px;
  object-fit:cover;
  border-radius:12px;
  margin-bottom:10px;
  background:#0d1219;
}

@media(max-width:500px){
  .products{
    grid-template-columns:1fr 1fr;
  }

  header h1{
    font-size:25px;
  }

  .nav button{
    padding:10px 5px;
    font-size:12px;
  }
}
</style>
</head>

<body>

<header>
<h1>🔥 UC SERVIS</h1>
<p>PUBG xizmatlari</p>
</header>

<div class="container">

<div class="nav">
<button onclick="showShop()">🛒 Do‘kon</button>
<button onclick="showHistory()">📋 Buyurtmalar</button>
<button onclick="showAdmin()">🔐 Admin</button>
</div>

<!-- SHOP -->

<section id="shop">

<h2 class="section-title">🪙 UC paketlari</h2>

<div class="products" id="ucList"></div>

<h2 class="section-title">💎 Qizil kristallar</h2>

<div class="products" id="crystalList"></div>

<h2 class="section-title">🚗 Super Cars</h2>

<div class="products" id="carList"></div>

<h2 class="section-title">🛒 Buyurtma</h2>

<div class="form">

<label>Mahsulot</label>
<input id="product" readonly placeholder="Mahsulot tanlang">

<label>Narx</label>
<input id="productPrice" readonly placeholder="0 so'm">

<label>Miqdor</label>
<input
id="quantity"
type="number"
min="1"
value="1"
oninput="calculateTotal()"
>

<label>PUBG ID</label>
<input id="pubgid" placeholder="PUBG ID">

<label>Telefon raqam</label>
<input id="phone" placeholder="+998 XX XXX XX XX">

<label>To‘lov usuli</label>

<select id="payment">
<option value="Payme">Payme</option>
<option value="Click">Click</option>
<option value="Uzcard">Uzcard</option>
</select>

<div class="total">
Jami:
<span id="total">0</span> so‘m
</div>

<button class="order-btn" onclick="createOrder()">
🛒 Buyurtma berish
</button>

<div id="message" class="message"></div>

</div>

</section>

<!-- HISTORY -->

<section id="history" style="display:none">

<h2 class="section-title">📋 Buyurtmalar tarixi</h2>

<div id="historyList"></div>

</section>

<!-- ADMIN -->

<section id="admin" style="display:none">

<h2 class="section-title">🔐 Admin panel</h2>

<div class="admin-box">

<label>Admin parol</label>

<input
id="adminPassword"
type="password"
placeholder="Admin parolini kiriting"
>

<button onclick="loginAdmin()">Kirish</button>

<div id="adminPanel" style="display:none">

<hr>

<h3>📊 Statistika</h3>

<p>Jami buyurtmalar:
<b id="adminTotal">0</b>
</p>

<p>Kutilayotgan:
<b id="adminPending">0</b>
</p>

<p>Bajarilgan:
<b id="adminCompleted">0</b>
</p>

<div id="adminOrders"></div>

</div>

</div>

</section>

</div>

<script>

/* =========================
   NARXLAR
========================= */

const UC = [
  {name:"60 UC",price:0},
  {name:"325 UC",price:0},
  {name:"660 UC",price:0},
  {name:"900 UC",price:0},
  {name:"1200 UC",price:0},
  {name:"1800 UC",price:0},
  {name:"3000 UC",price:0},
  {name:"5000 UC",price:0},
  {name:"6000 UC",price:0},
  {name:"9000 UC",price:0}
];

const CRYSTALS = [
  {name:"50 kristall",price:40000},
  {name:"100 kristall",price:73000},
  {name:"150 kristall",price:100000},
  {name:"200 kristall",price:137000},
  {name:"250 kristall",price:156000},
  {name:"300 kristall",price:199000},
  {name:"400 kristall",price:258000},
  {name:"500 kristall",price:310000},
  {name:"600 kristall",price:370000},
  {name:"700 kristall",price:420000},
  {name:"800 kristall",price:478000},
  {name:"900 kristall",price:550000},
  {name:"1000 kristall",price:600000}
];

/*
  Super Car narxlari hozircha bo'sh.
  Keyinchalik shu joydan to'ldiriladi.
*/

const CARS = [
  {name:"Super Car 1",price:0,image:""},
  {name:"Super Car 2",price:0,image:""},
  {name:"Super Car 3",price:0,image:""},
  {name:"Super Car 4",price:0,image:""},
  {name:"Super Car 5",price:0,image:""}
];

/* =========================
   MAHSULOT TANLASH
========================= */

let selectedPrice = 0;

function formatMoney(number){
  return Number(number).toLocaleString("uz-UZ");
}

function selectProduct(name,price){

  document.getElementById("product").value = name;

  selectedPrice = Number(price);

  document.getElementById("productPrice").value =
    selectedPrice > 0
    ? formatMoney(selectedPrice) + " so'm"
    : "Narx kiritilmagan";

  calculateTotal();

  document.getElementById("product").scrollIntoView({
    behavior:"smooth"
  });
}

function calculateTotal(){

  const quantity =
    Number(document.getElementById("quantity").value) || 1;

  const total = selectedPrice * quantity;

  document.getElementById("total").textContent =
    formatMoney(total);
}

/* =========================
   KATALOG
========================= */

function renderProducts(list,elementId,icon){

  const box = document.getElementById(elementId);

  box.innerHTML = "";

  list.forEach(item => {

    const card = document.createElement("div");

    card.className = "card";

    let imageHTML = "";

    if(item.image){
      imageHTML =
      `<img class="car-image" src="${item.image}" alt="">`;
    }

    card.innerHTML = `
      ${imageHTML}
      <div class="icon">${icon}</div>
      <h3>${item.name}</h3>

      <div class="price">
        ${
          item.price > 0
          ? formatMoney(item.price)+" so'm"
          : "Narxni kiriting"
        }
      </div>

      <button onclick="selectProduct('${item.name}',${item.price})">
        Tanlash
      </button>
    `;

    box.appendChild(card);

  });
}

function loadProducts(){

  renderProducts(
    UC,
    "ucList",
    "🪙"
  );

  renderProducts(
    CRYSTALS,
    "crystalList",
    "💎"
  );

  renderProducts(
    CARS,
    "carList",
    "🚗"
  );

}

/* =========================
   SAHIFALAR
========================= */

function hideAll(){

  document.getElementById("shop").style.display="none";

  document.getElementById("history").style.display="none";

  document.getElementById("admin").style.display="none";
}

function showShop(){

  hideAll();

  document.getElementById("shop").style.display="block";

}

function showHistory(){

  hideAll();

  document.getElementById("history").style.display="block";

  loadHistory();

}

function showAdmin(){

  hideAll();

  document.getElementById("admin").style.display="block";

}

/* =========================
   BUYURTMA
========================= */

function createOrder(){

  const product =
    document.getElementById("product").value;

  const quantity =
    Number(document.getElementById("quantity").value) || 1;

  const pubgid =
    document.getElementById("pubgid").value.trim();

  const phone =
    document.getElementById("phone").value.trim();

  const payment =
    document.getElementById("payment").value;

  if(!product){

    alert("Avval mahsulot tanlang!");

    return;
  }

  if(selectedPrice <= 0){

    alert("Bu mahsulotning narxi hali kiritilmagan!");

    return;
  }

  if(!pubgid){

    alert("PUBG ID kiriting!");

    return;
  }

  if(!phone){

    alert("Telefon raqam kiriting!");

    return;
  }

  const total =
    selectedPrice * quantity;

  const order = {

    id:
      "UC-" +
      Date.now(),

    product:product,

    quantity:quantity,

    price:selectedPrice,

    total:total,

    pubgid:pubgid,

    phone:phone,

    payment:payment,

    status:"Kutilmoqda",

    date:
      new Date().toLocaleString("uz-UZ")

  };

  const orders =
    JSON.parse(
      localStorage.getItem("ucOrders") || "[]"
    );

  orders.push(order);

  localStorage.setItem(
    "ucOrders",
    JSON.stringify(orders)
  );

  document.getElementById("message").textContent =
    "✅ Buyurtma qabul qilindi: " + order.id;

  loadAdmin();

}

/* =========================
   BUYURTMALAR
========================= */

function loadHistory(){

  const box =
    document.getElementById("historyList");

  const orders =
    JSON.parse(
      localStorage.getItem("ucOrders") || "[]"
    );

  if(orders.length===0){

    box.innerHTML =
      `<p class="small">
        Hozircha buyurtmalar yo'q.
      </p>`;

    return;
  }

  box.innerHTML = "";

  orders.slice().reverse().forEach(order => {

    box.innerHTML += `

      <div class="history-item">

        <b>${order.product}</b>

        <p>Miqdor: ${order.quantity}</p>

        <p>Jami:
        <b>${formatMoney(order.total)} so'm</b>
        </p>

        <p>To'lov: ${order.payment}</p>

        <p>ID: ${order.pubgid}</p>

        <p class="status">
        ${order.status}
        </p>

        <p class="small">
        ${order.date}
        </p>

      </div>

    `;

  });

}

/* =========================
   ADMIN
========================= */

/*
  Bu hozircha lokal admin panel.
  Haqiqiy xavfsiz admin uchun backend kerak.
*/

const ADMIN_PASSWORD = "123456";

function loginAdmin(){

  const password =
    document.getElementById("adminPassword").value;

  if(password !== ADMIN_PASSWORD){

    alert("Parol noto'g'ri!");

    return;
  }

  document.getElementById("adminPanel")
    .style.display="block";

  loadAdmin();

}

function loadAdmin(){

  const orders =
    JSON.parse(
      localStorage.getItem("ucOrders") || "[]"
    );

  document.getElementById("adminTotal")
    .textContent = orders.length;

  document.getElementById("adminPending")
    .textContent =
      orders.filter(x =>
        x.status === "Kutilmoqda"
      ).length;

  document.getElementById("adminCompleted")
    .textContent =
      orders.filter(x =>
        x.status === "Bajarildi"
      ).length;

  const box =
    document.getElementById("adminOrders");

  box.innerHTML = "";

  orders.slice().reverse().forEach(order => {

    box.innerHTML += `

      <div class="history-item">

        <b>${order.product}</b>

        <p>Buyurtma:
        ${order.id}
        </p>

        <p>PUBG ID:
        ${order.pubgid}
        </p>

        <p>Telefon:
        ${order.phone}
        </p>

        <p>To'lov:
        ${order.payment}
        </p>

        <p>Jami:
        ${formatMoney(order.total)} so'm
        </p>

        <p>Status:
        <b>${order.status}</b>
        </p>

        <button
          onclick="changeStatus('${order.id}','Bajarildi')">
          ✅ Bajarildi
        </button>

        <button
          onclick="changeStatus('${order.id}','Bekor qilindi')">
          ❌ Bekor qilish
        </button>

      </div>

    `;

  });

}

function changeStatus(id,status){

  const orders =
    JSON.parse(
      localStorage.getItem("ucOrders") || "[]"
    );

  const order =
    orders.find(x => x.id === id);

  if(order){

    order.status = status;

    localStorage.setItem(
      "ucOrders",
      JSON.stringify(orders)
    );

  }

  loadAdmin();

}

/* =========================
   START
========================= */

loadProducts();

showShop();

</script>

</body>
</html>
