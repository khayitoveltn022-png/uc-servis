*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b0d12;
  color:#fff;
}
header{
  padding:20px;
  text-align:center;
  background:#11151d;
  border-bottom:1px solid #242a35;
}
header h1{margin:0;font-size:28px}
header p{color:#aaa;margin:7px 0 0}

.container{padding:18px;max-width:700px;margin:auto}

.section-title{
  font-size:22px;
  margin:25px 0 12px;
}

.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.card{
  background:#151a23;
  border:1px solid #29313e;
  border-radius:15px;
  padding:16px;
  text-align:center;
}

.icon{font-size:42px;margin-bottom:8px}
.card h3{margin:5px 0}
.price{color:#ffd54a;font-weight:bold;margin:8px 0}

button{
  border:0;
  border-radius:10px;
  padding:11px 15px;
  background:#f5b400;
  color:#111;
  font-weight:bold;
  cursor:pointer;
}
button:hover{opacity:.9}

.form{
  background:#151a23;
  padding:18px;
  border-radius:15px;
  margin-top:15px;
}

input,select{
  width:100%;
  padding:13px;
  margin:7px 0 13px;
  border-radius:9px;
  border:1px solid #303846;
  background:#0d1118;
  color:#fff;
}
