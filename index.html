const UC_API = "";

async function checkPubgId() {
    const input = document.querySelector(
        'input[name="player_id"], input[id="player_id"], #player_id'
    );

    if (!input) {
        alert("PUBG ID input topilmadi.");
        return;
    }

    const playerId = input.value.trim();

    if (!playerId) {
        alert("PUBG ID kiriting.");
        return;
    }

    try {
        const response = await fetch("/api/pubg/validate", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                player_id: playerId
            })
        });

        const data = await response.json();

        if (!response.ok || !data.ok) {
            alert(
                "PUBG ID tekshirilmadi: " +
                (data.error || "Noma'lum xato")
            );
            return;
        }

        alert(
            "✅ PUBG ID tasdiqlandi!" +
            (data.player_name
                ? "\nNick: " + data.player_name
                : "")
        );

    } catch (error) {
        alert("Server bilan aloqa qilishda xato.");
        console.error(error);
    }
}


// ===============================
// FAZERCARDS UC OFFERLARI

          UC SERVIS narxlaringizga bog'laymiz.
        */
    } catch (error) {
        console.error("Offerlarni olishda xato:", error);
    }
}

loadFazerOffers();

<script>

/* =====================================
   UC NARXLARI
===================================== */

const prices = [

[60,11500],

[120,23000],

[180,34500],

[240,46000],

[300,57500],

[360,69000],

[420,80500],

[480,92000],

[540,103500],

[600,115000],

[660,117000],

[720,126000],

[840,147000],

[960,223500],

[1080,251500],

[1200,279500],

[1500,346000],

[1800,392500],

[2000,439000],

[2500,545500],

[3000,651500],

[4000,864500],

[5000,1064000],

[6000,1263500],

[8000,1662500],

[10000,2061500],

[15000,3059000],

[20000,4056500],

[25000,5054000],

[30000,6051500]

];



/* =====================================
   SERVER
===================================== */

/*
   Agar backend boshqa manzilda bo‘lsa,
   shu yerga backend URL yoziladi.

   Masalan:

   const API =
   "https://sizning-backend-saytingiz.com";

*/

const API = "";



/* =====================================
   PUL FORMAT
===================================== */

function money(number){

  return Number(number || 0)
    .toLocaleString("uz-UZ");

}



/* =====================================
   UC NARXINI HISOBLASH
===================================== */

function localQuote(q){

  if(q < 60 || q > 30000){

    return null;

  }


  for(let i = 0; i < prices.length - 1; i++){

    if(q === prices[i][0]){

      return prices[i][1];

    }


    if(
      q > prices[i][0] &&
      q < prices[i + 1][0]
    ){

      return Math.round(

        prices[i][1]

        +

        (q - prices[i][0])

        *

        (

          prices[i + 1][1]
          -
          prices[i][1]

        )

        /

        (

          prices[i + 1][0]
          -
          prices[i][0]

        )

      );

    }

  }


  return prices[prices.length - 1][1];

}



/* =====================================
   NARXNI KO‘RSATISH
===================================== */

function quote(){

  const q =
    Number(
      document.getElementById("uc").value
    ) || 0;


  const p =
    localQuote(q);


  document.getElementById("price")
    .textContent =
    p
      ? money(p)
      : "0";

}



/* =====================================
   API
===================================== */

async function api(url, options = {}){

  const response =
    await fetch(
      API + url,
      {

        ...options,

        headers:{

          "Content-Type":
            "application/json",

          ...(options.headers || {})

        }

      }
    );


  const data =
    await response.json();


  if(!response.ok){

    throw new Error(
      data.error ||
      "Xatolik yuz berdi"
    );

  }


  return data;

}



/* =====================================
   BUYURTMA
===================================== */

async function order(){

  const q =
    Number(
      document.getElementById("uc").value
    ) || 0;


  const pubgId =
    document
      .getElementById("pubg")
      .value
      .trim();


  const phone =
    document
      .getElementById("phone")
      .value
      .trim();


  const payment =
    document
      .getElementById("payment")
      .value;


  if(!localQuote(q)){

    show(

      "msg",

      "UC miqdori 60–30 000 oralig‘ida bo‘lishi kerak.",

      true

    );

    return;

  }


  if(!pubgId){

    show(
      "msg",
      "PUBG ID kiriting.",
      true
    );

    return;

  }


  if(!phone){

    show(
      "msg",
      "Telefon raqam kiriting.",
      true
    );

    return;

  }


  try{

    const data =
      await api(

        "/api/orders",

        {

          method:"POST",

          body:JSON.stringify({

            uc:q,

            pubgId:pubgId,

            phone:phone,

            payment:payment

          })

        }

      );


    show(

      "msg",

      "✅ Buyurtma qabul qilindi. Buyurtma № " +

      data.orderId

    );


  }

  catch(error){

    show(
      "msg",
      error.message,
      true
    );

  }

}



/* =====================================
   BUYURTMALAR TARIXI
===================================== */

async function historyLoad(){

  const phone =
    document
      .getElementById("hphone")
      .value
      .trim();


  if(!phone){

    document.getElementById("list")
      .textContent =
      "Telefon raqamingizni kiriting.";

    return;

  }


  try{

    const data =
      await api(

        "/api/orders?phone=" +
        encodeURIComponent(phone)

      );


    const list =
      document.getElementById("list");


    if(
      !data.orders ||
      data.orders.length === 0
    ){

      list.innerHTML =
        `<div class="card">
          Buyurtma topilmadi.
        </div>`;

      return;

    }


    list.innerHTML =
      data.orders
        .slice()
        .reverse()
        .map(

          order => `

          <div class="history">

            <b>
              Buyurtma #${order.id}
            </b>

            <p>
              💎 ${Number(order.uc).toLocaleString()}
              UC
            </p>

            <p>
              💰 ${money(order.price)}
              so‘m
            </p>

            <p>
              🧾 ${order.status}
            </p>

            <p class="small">
              ${order.createdAt}
            </p>

          </div>

          `

        )
        .join("");


  }

  catch(error){

    document.getElementById("list")
      .textContent =
      error.message;

  }

}



/* =====================================
   MUROJAAT
===================================== */

async function complaint(){

  const phone =
    document
      .getElementById("cphone")
      .value
      .trim();


  const text =
    document
      .getElementById("ctext")
      .value
      .trim();


  if(!phone || !text){

    show(

      "cmsg",

      "Telefon va murojaatni kiriting.",

      true

    );

    return;

  }


  try{

    await api(

      "/api/complaints",

      {

        method:"POST",

        body:JSON.stringify({

          phone:phone,

          text:text

        })

      }

    );


    show(
      "cmsg",
      "✅ Murojaat yuborildi."
    );


    document
      .getElementById("ctext")
      .value = "";


  }

  catch(error){

    show(
      "cmsg",
      error.message,
      true
    );

  }

}



/* =====================================
   XABAR
===================================== */

function show(
  id,
  text,
  error = false
){

  const element =
    document.getElementById(id);


  element.className =
    error
      ? "err"
      : "ok";


  element.textContent =
    text;

}



/* =====================================
   SAHIFA ALMASHTIRISH
===================================== */

function page(id){

  const pages = [

    "shop",

    "history",

    "complaint"

  ];


  pages.forEach(

    name => {

      document
        .getElementById(name)
        .classList
        .add("hidden");

    }

  );


  document
    .getElementById(id)
    .classList
    .remove("hidden");

}



/* =====================================
   BOSHLANG‘ICH SAHIFA
===================================== */

page("shop");

</script>
